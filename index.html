
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RK AI APK Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#0b1220;color:white}
.card{max-width:700px;margin:16px auto;padding:22px;background:#172238;border-radius:16px;border:1px solid #30415d}
h1{text-align:center;color:#18e5ee}
p{line-height:1.6}
label{display:block;margin-top:18px;font-weight:bold}
input,textarea,select,button{width:100%;padding:13px;margin-top:8px;border-radius:8px;font-size:16px}
input,textarea,select{background:#0b1220;color:white;border:1px solid #40516e}
button{border:0;background:#18bfc9;color:#07111e;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
#downloadBtn{background:#57e39b;margin-top:12px}
#buildBtn{background:#ffbd59;margin-top:12px}
#copyBtn{background:#8da8ff;margin-top:12px}
#result{display:none;margin-top:20px;padding:14px;background:#0b1220;border-radius:10px;overflow-wrap:anywhere}
#output{white-space:pre-wrap;max-height:450px;overflow:auto;font-size:13px}
.status{color:#57e39b}
.note{color:#c3d0e4;font-size:14px}
.small{color:#aabbd2;font-size:12px}
a{color:#18e5ee;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="card">
<h1>⚡ RK AI APK Builder</h1>
<p>अपना ऐप आइडिया लिखें। AI से पूरा Android प्रोजेक्ट बनवाएँ, ZIP डाउनलोड करें या APK Build शुरू करें।</p>

<label for="appname">ऐप का नाम</label>
<input id="appname" maxlength="100" placeholder="जैसे: My Smart App">

<label for="apptype">ऐप की कैटेगरी</label>
<select id="apptype">
<option value="Education App">Education & Learning</option>
<option value="Calculator and Utility App">Calculator & Tools</option>
<option value="Music and Video App">Music & Video Player</option>
<option value="Game App">Games & Entertainment</option>
<option value="Business and Finance App">Business & Finance</option>
<option value="Shopping and E-commerce App">Shopping & E-commerce</option>
<option value="Social Media and Chat App">Social Media & Chat</option>
<option value="News and Blog App">News & Blog</option>
<option value="Health and Fitness App">Health & Fitness</option>
<option value="Travel and Booking App">Travel & Booking</option>
<option value="Food and Restaurant App">Food & Restaurant</option>
<option value="Photo and Video Editor App">Photo & Video Editor</option>
<option value="AI Assistant and Chatbot App">AI Assistant & Chatbot</option>
<option value="Productivity and Notes App">Productivity & Notes</option>
<option value="Utility and Security App">Utility & Security</option>
<option value="Real Estate App">Real Estate</option>
<option value="Job and Career App">Job & Career</option>
<option value="Religious and Spiritual App">Religious & Spiritual</option>
<option value="Kids and Learning App">Kids & Learning</option>
<option value="Other Custom Android App">Other / Custom App</option>
</select>

<label for="features">ऐप में क्या-क्या चाहिए?</label>
<textarea id="features" rows="6" maxlength="5000" placeholder="अपने ऐप के सभी फीचर्स विस्तार से लिखें..."></textarea>

<button id="generateBtn" onclick="generateApp()">AI से पूरा ऐप बनवाएँ</button>

<section id="result">
<strong id="resultTitle">AI का जवाब</strong>
<p id="status" class="status"></p>
<div id="fileInfo"></div>
<div id="workflowLink"></div>
<pre id="output"></pre>

<button id="downloadBtn" onclick="downloadProject()" hidden>Android Project ZIP डाउनलोड करें</button>
<button id="buildBtn" onclick="buildApk()" hidden>🚀 APK बनाएँ</button>
<button id="copyBtn" onclick="copyResult()">जवाब कॉपी करें</button>
</section>

<p class="note">नोट: ZIP एक Android Studio प्रोजेक्ट है। APK बनाने के लिए GitHub Build System का उपयोग होगा।</p>
<p class="small">RK AI APK Builder</p>
</main>

<script>
let generatedFiles=[];
let generatedText="";

const $=id=>document.getElementById(id);

async function readResponse(response){
 const text=await response.text();
 let data;
 try{data=JSON.parse(text)}
 catch{throw new Error("सर्वर का जवाब पढ़ा नहीं जा सका।")}
 if(!response.ok)throw new Error(data.error||"API Error: "+response.status);
 return data;
}

function validateFiles(files){
 if(!Array.isArray(files)||files.length===0)
  throw new Error("AI ने कोई प्रोजेक्ट फाइल नहीं बनाई।");

 if(files.length>80)
  throw new Error("प्रोजेक्ट में 80 से ज्यादा फाइलें हैं।");

 const seen=new Set();
 let total=0;

 for(const file of files){
  if(!file||typeof file.path!=="string"||typeof file.content!=="string")
   throw new Error("AI से मिली फाइल का फॉर्मेट गलत है।");

  const path=file.path.replace(/\\/g,"/").trim();

  if(!path||path.startsWith("/")||path.split("/").includes("..")||
     !/^[a-zA-Z0-9_./-]+$/.test(path))
   throw new Error("असुरक्षित फाइल पाथ मिला: "+path);

  if(seen.has(path))throw new Error("एक ही फाइल दो बार मिली: "+path);
  seen.add(path);
  total+=new TextEncoder().encode(file.content).length;
 }

 if(total>2*1024*1024)
  throw new Error("प्रोजेक्ट 2 MB से बड़ा है।");

 const required=[
  "settings.gradle",
  "app/build.gradle",
  "app/src/main/AndroidManifest.xml"
 ];
 const missing=required.filter(path=>!seen.has(path));

 if(missing.length)
  throw new Error("जरूरी Android फाइलें गायब हैं: "+missing.join(", "));

 return files;
}

async function generateApp(){
 const appName=$("appname").value.trim();
 const appType=$("apptype").value;
 const features=$("features").value.trim();

 if(!appName||!features){
  alert("ऐप का नाम और फीचर्स लिखें।");
  return;
 }

 const button=$("generateBtn");
 button.disabled=true;
 button.textContent="AI पूरा ऐप तैयार कर रहा है...";

 $("result").style.display="block";
 $("resultTitle").textContent="प्रोजेक्ट जनरेशन शुरू";
 $("status").textContent="Gemini AI से संपर्क हो रहा है...";
 $("output").textContent="";
 $("fileInfo").textContent="";
 $("workflowLink").innerHTML="";
 $("downloadBtn").hidden=true;
 $("buildBtn").hidden=true;
 generatedFiles=[];
 generatedText="";

 try{
  const response=await fetch("/api/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({appName,appType,features})
  });

  const data=await readResponse(response);

  if(data.status!=="completed")
   throw new Error("AI प्रोजेक्ट पूरा नहीं हुआ।");

  generatedFiles=validateFiles(data.files);
  generatedText=JSON.stringify(data,null,2);

  $("resultTitle").textContent="Android प्रोजेक्ट तैयार है";
  $("status").textContent="सफलतापूर्वक फाइलें तैयार हो गईं।";
  $("fileInfo").textContent=
   "कुल "+generatedFiles.length+" फाइलें तैयार हुईं।";

  $("output").textContent=generatedFiles.map(file=>file.path).join("\n");

  $("downloadBtn").hidden=false;
  $("buildBtn").hidden=false;

 }catch(error){
  generatedFiles=[];
  $("resultTitle").textContent="त्रुटि";
  $("status").textContent="प्रोजेक्ट तैयार नहीं हुआ।";
  $("output").textContent=error.message;
 }finally{
  button.disabled=false;
  button.textContent="AI से पूरा ऐप बनवाएँ";
 }
}

function makeZip(files){
 const encoder=new TextEncoder();
 const localParts=[];
 const centralParts=[];
 let offset=0;

 function crc32(bytes){
  let crc=0xffffffff;
  for(const byte of bytes){
   crc^=byte;
   for(let j=0;j<8;j++)
    crc=(crc>>>1)^((crc&1)?0xedb88320:0);
  }
  return (crc^0xffffffff)>>>0;
 }

 function header(size){return new Uint8Array(size)}
 function w16(view,pos,value){view.setUint16(pos,value,true)}
 function w32(view,pos,value){view.setUint32(pos,value>>>0,true)}

 for(const file of files){
  const name=encoder.encode(file.path);
  const data=encoder.encode(file.content);
  const crc=crc32(data);

  const local=header(30+name.length);
  const lv=new DataView(local.buffer);
  w32(lv,0,0x04034b50);
  w16(lv,4,20);
  w16(lv,6,0x0800);
  w16(lv,8,0);
  w32(lv,14,crc);
  w32(lv,18,data.length);
  w32(lv,22,data.length);
  w16(lv,26,name.length);
  local.set(name,30);
  localParts.push(local,data);

  const central=header(46+name.length);
  const cv=new DataView(central.buffer);
  w32(cv,0,0x02014b50);
  w16(cv,4,20);
  w16(cv,6,20);
  w16(cv,8,0x0800);
  w16(cv,10,0);
  w32(cv,16,crc);
  w32(cv,20,data.length);
  w32(cv,24,data.length);
  w16(cv,28,name.length);
  w32(cv,42,offset);
  central.set(name,46);
  centralParts.push(central);

  offset+=local.length+data.length;
 }

 const centralSize=centralParts.reduce((sum,p)=>sum+p.length,0);
 const end=header(22);
 const ev=new DataView(end.buffer);
 w32(ev,0,0x06054b50);
 w16(ev,8,files.length);
 w16(ev,10,files.length);
 w32(ev,12,centralSize);
 w32(ev,16,offset);

 return new Blob([...localParts,...centralParts,end],{type:"application/zip"});
}

function downloadProject(){
 if(!generatedFiles.length){
  alert("पहले AI से प्रोजेक्ट बनवाएँ।");
  return;
 }

 try{
  const blob=makeZip(generatedFiles);
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  const name=($("appname").value.trim()||"AndroidProject")
   .replace(/[^a-zA-Z0-9_-]+/g,"_");
  link.href=url;
  link.download=name+".zip";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
 }catch(error){
  alert("ZIP बनाने में समस्या: "+error.message);
 }
}

async function buildApk(){
 if(!generatedFiles.length){
  alert("पहले AI से ऐप बनवाएँ।");
  return;
 }

 const button=$("buildBtn");
 button.disabled=true;
 button.textContent="APK Build शुरू हो रहा है...";
 $("workflowLink").innerHTML="";

 try{
  const blob=makeZip(generatedFiles);

  if(blob.size>3*1024*1024)
   throw new Error("ZIP 3 MB से बड़ी है। अभी छोटी ZIP से कोशिश करें।");

  const base64=await new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>resolve(String(reader.result).split(",")[1]);
   reader.onerror=()=>reject(new Error("ZIP पढ़ने में समस्या आई।"));
   reader.readAsDataURL(blob);
  });

  $("status").textContent="GitHub पर प्रोजेक्ट भेजा जा रहा है...";

  const response=await fetch("/api/build",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    appName:$("appname").value.trim(),
    zipBase64:base64
   })
  });

  const data=await readResponse(response);

  $("status").textContent="GitHub APK Build शुरू हो गया है!";
  $("output").textContent=
   (data.message||"Build शुरू हुआ।")+
   "\nZIP: "+(data.zipName||"");

  if(data.workflowUrl){
   const link=document.createElement("a");
   link.href=data.workflowUrl;
   link.target="_blank";
   link.rel="noopener";
   link.textContent="GitHub पर Build का स्टेटस देखें";
   $("workflowLink").replaceChildren(link);
  }

 }catch(error){
  $("status").textContent="APK Build शुरू नहीं हो सका।";
  $("output").textContent=error.message;
 }finally{
  button.disabled=false;
  button.textContent="🚀 APK बनाएँ";
 }
}

async function copyResult(){
 const text=$("output").textContent;
 try{
  await navigator.clipboard.writeText(text);
  alert("जवाब कॉपी हो गया!");
 }catch{
  alert("जवाब को चुनकर कॉपी करें।");
 }
}
</script>
</body>
</html>
