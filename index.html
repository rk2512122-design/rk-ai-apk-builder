
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RK AI APK Builder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }
    .card {
      max-width: 560px;
      margin: 20px auto;
      padding: 22px;
      background: #172238;
      border-radius: 16px;
    }
    h1 { color: #18e5ee; text-align: center; }
    p { line-height: 1.6; }
    label { display: block; margin-top: 18px; }
    input, textarea, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 16px;
    }
    input, textarea, select {
      background: #0b1220;
      color: white;
      border: 1px solid #40516e;
    }
    button {
      border: 0;
      background: #18bfc9;
      color: #07111e;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      display: none;
      margin-top: 20px;
      padding: 14px;
      background: #0b1220;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .note { color: #c3d0e4; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>⚡ RK AI APK Builder</h1>
    <p>अपना ऐप बनाने का आइडिया लिखें।</p>

    <label for="appname">ऐप का नाम</label>
    <input id="appname" placeholder="जैसे: My Study App">

    <label for="apptype">ऐप का प्रकार</label>
    <select id="apptype">
      <option>Education App</option>
      <option>Calculator</option>
      <option>Music Player</option>
      <option>Game</option>
      <option>Business App</option>
      <option>Other Android App</option>
    </select>

    <label for="features">ऐप में क्या-क्या चाहिए?</label>
    <textarea id="features" rows="5"
      placeholder="ऐप की सुविधाएँ यहाँ लिखें"></textarea>

    <button onclick="makeRequest()">ऐप बनाने का अनुरोध तैयार करें</button>

    <section id="result">
      <strong>आपके ऐप का अनुरोध:</strong>
      <p id="summary"></p>
      <button onclick="copyRequest()">अनुरोध कॉपी करें</button>
    </section>

    <p class="note">
      अगला चरण: सुरक्षित AI सेवा से कोड बनाना और Android APK बिल्ड करना।
    </p>
  </main>

  <script>
    let requestText = "";

    function makeRequest() {
      const name = document.getElementById("appname").value.trim();
      const type = document.getElementById("apptype").value;
      const features = document.getElementById("features").value.trim();

      if (!name || !features) {
        alert("कृपया ऐप का नाम और उसकी सुविधाएँ लिखें।");
        return;
      }

      requestText =
        "Create a complete Android app project.\n" +
        "App name: " + name + "\n" +
        "App type: " + type + "\n" +
        "Required features: " + features + "\n" +
        "Generate Android source code and build an installable APK.";

      document.getElementById("summary").textContent = requestText;
      document.getElementById("result").style.display = "block";
    }

    async function copyRequest() {
      try {
        await navigator.clipboard.writeText(requestText);
        alert("अनुरोध कॉपी हो गया।");
      } catch (e) {
        alert("अनुरोध कॉपी नहीं हुआ। टेक्स्ट को दबाकर कॉपी करें।");
      }
    }
  </script>
</body>
</html>
