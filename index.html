
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RK AI APK Builder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }
    .card {
      max-width: 600px;
      margin: 20px auto;
      padding: 22px;
      background: #172238;
      border-radius: 16px;
    }
    h1 { color: #18e5ee; text-align: center; }
    p { line-height: 1.6; }
    label { display: block; margin-top: 18px; }
    input, textarea, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 16px;
    }
    input, textarea, select {
      background: #0b1220;
      color: white;
      border: 1px solid #40516e;
    }
    button {
      border: 0;
      background: #18bfc9;
      color: #07111e;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #result {
      margin-top: 20px;
      padding: 14px;
      background: #0b1220;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      display: none;
    }
    .note { color: #c3d0e4; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>⚡ RK AI APK Builder</h1>
    <p>अपने Android ऐप का आइडिया लिखें। AI से कोड और प्रोजेक्ट की योजना तैयार करवाएँ।</p>

    <label for="appname">ऐप का नाम</label>
    <input id="appname" placeholder="जैसे: My Study App">

    <label for="apptype">ऐप का प्रकार</label>
    <select id="apptype">
      <option>Education App</option>
      <option>Calculator</option>
      <option>Music Player</option>
      <option>Game</option>
      <option>Business App</option>
      <option>Other Android App</option>
    </select>

    <label for="features">ऐप में क्या-क्या चाहिए?</label>
    <textarea id="features" rows="5"
      placeholder="जैसे: Login screen, home screen, quiz"></textarea>

    <button id="generateBtn" onclick="generateApp()">
      AI से ऐप का कोड बनवाएँ
    </button>

    <section id="result">
      <strong id="resultTitle">AI का जवाब</strong>
      <p id="output"></p>
      <button onclick="copyResult()">जवाब कॉपी करें</button>
    </section>

    <p class="note">
      ध्यान दें: AI से कोड मिलना अपने-आप installable APK बनने की गारंटी नहीं है।
      APK बनाने के लिए Android प्रोजेक्ट को बिल्ड करना होगा।
    </p>
  </main>

  <script>
    const sleep = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    async function readResponse(response) {
      const text = await response.text();
      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error(
          "सर्वर से सही JSON जवाब नहीं मिला। कृपया Logs जाँचें।"
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error || `API Error: ${response.status}`
        );
      }

      return data;
    }

    async function generateApp() {
      const appName =
        document.getElementById("appname").value.trim();
      const appType =
        document.getElementById("apptype").value;
      const features =
        document.getElementById("features").value.trim();

      const button = document.getElementById("generateBtn");
      const result = document.getElementById("result");
      const output = document.getElementById("output");
      const title = document.getElementById("resultTitle");

      if (!appName || !features) {
        alert("कृपया ऐप का नाम और फीचर्स लिखें।");
        return;
      }

      button.disabled = true;
      button.textContent = "AI जवाब तैयार कर रहा है...";
      result.style.display = "block";
      title.textContent = "काम शुरू हो गया";
      output.textContent = "Gemini AI से संपर्क हो रहा है...";

      try {
        const startResponse = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ appName, appType, features })
        });

        const task = await readResponse(startResponse);

        // Support a direct completed result if returned by the API.
        let answer = task.result || task.output || task.text;

        if (!answer && task.id) {
          title.textContent = "AI जवाब तैयार कर रहा है";

          // Check background task status for up to 3 minutes.
          for (let attempt = 0; attempt < 90; attempt++) {
            output.textContent =
              `Gemini काम कर रहा है... (${attempt + 1}/90)\n` +
              "कृपया यह पेज खुला रखें।";

            await sleep(2000);

            const statusResponse = await fetch(
              "/api/generate?id=" + encodeURIComponent(task.id),
              { method: "GET", cache: "no-store" }
            );

            const statusData = await readResponse(statusResponse);

            if (statusData.status === "completed") {
              answer =
                statusData.result ||
                statusData.output ||
                statusData.text;
              break;
            }

            if (
              statusData.status === "failed" ||
              statusData.status === "cancelled"
            ) {
              throw new Error(
                statusData.error || "Gemini का काम पूरा नहीं हुआ।"
              );
            }
          }
        }

        if (!answer) {
          throw new Error(
            "3 मिनट में जवाब नहीं मिला। कृपया Runtime Logs जाँचें।"
          );
        }

        title.textContent = "AI का जवाब";
        output.textContent = answer;

      } catch (error) {
        title.textContent = "त्रुटि";
        output.textContent =
          error.message ||
          "अनुरोध पूरा नहीं हुआ। कृपया Runtime Logs जाँचें।";
      } finally {
        button.disabled = false;
        button.textContent = "AI से ऐप का कोड बनवाएँ";
      }
    }

    async function copyResult() {
      const text = document.getElementById("output").textContent;

      try {
        await navigator.clipboard.writeText(text);
        alert("जवाब कॉपी हो गया!");
      } catch {
        alert("जवाब को चुनकर कॉपी करें।");
      }
    }
  </script>
</body>
</html>
